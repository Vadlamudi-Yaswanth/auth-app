<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authorization</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div>
    <form id="login-form" class="container">
      <h2>Login</h2>
      <label for="login-email">Email:</label>
      <input type="email" id="login-email" name="email" required><br><br>

      <label for="login-password">Password:</label>
      <input type="password" id="login-password" name="password" required><br><br>

      <button type="submit" class="button">LOGIN</button>
      <p>Don't have an account? <span id="show-register">Register here</span></p>
      <p id="login-message"></p>
    </form>

    <!-- Register Form -->
    <form id="register-form" class="container hide">
      <h2>Register</h2>
      <label for="reg-name">Full Name:</label>
      <input type="text" id="reg-name" name="username" required><br><br>

      <label for="reg-email">Email:</label>
      <input type="email" id="reg-email" name="email" required><br><br>

      <label for="reg-password">Password:</label>
      <input type="password" id="reg-password" name="password" required><br><br>

      <label for="reg-confirm">Confirm Password:</label>
      <input type="password" id="reg-confirm" name="confirm-password" required><br><br>

      <button type="submit" class="button2">Register</button>
      <p>Already have an account? <span id="show-login">Login here</span></p>
      <p id="message"></p>
    </form>
  </div>

  <script src="script.js"></script>
</body>

</html>
